name: make android release

on:
  push:
    tags:
      - '1.18-chimahon.*'

  workflow_dispatch:

jobs:
  publish-lts-on-linux:
    name: android lts on linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: set up jdk 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: run the build script
        run: |
          set -o pipefail
          ./android.sh --lts --disable-arm-v7a-neon --enable-cpu-features \
            2>&1 | tee native-build.log
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          SOURCE_ARCHIVE_OUTPUT: ${{ github.workspace }}/ffmpeg-kit-source-${{ github.ref_name }}.tar.gz
      - name: copy build artifact
        run: mv prebuilt/bundle-android-aar-lts/ffmpeg-kit/ffmpeg-kit.aar aniyomi-ffmpeg-kit-${{ github.ref_name }}.aar
      - name: record toolchain and checksums
        run: |
          set -euo pipefail
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "runner_image=${ImageOS:-unknown}"
            echo "runner_image_version=${ImageVersion:-unknown}"
            java -version
            android/gradlew --version
            cat aniyomi-mpv-lib/buildscripts/sdk/android-ndk-r27c/source.properties
            sha256sum aniyomi-mpv-lib/buildscripts/sdk/bin/gas-preprocessor.pl
          } > toolchain-evidence.txt 2>&1
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -cf - \
            toolchain-evidence.txt build.log native-build.log |
            gzip -n > ffmpeg-kit-toolchain-${{ github.ref_name }}.tar.gz
          sha256sum \
            aniyomi-ffmpeg-kit-${{ github.ref_name }}.aar \
            ffmpeg-kit-source-${{ github.ref_name }}.tar.gz \
            ffmpeg-kit-toolchain-${{ github.ref_name }}.tar.gz \
            > SHA256SUMS
      - name: verify release artifacts
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          if tar -tzf ffmpeg-kit-source-${{ github.ref_name }}.tar.gz |
            grep -E '(^|/)\.git(/|$)'; then
            echo "Source archive contains Git metadata." >&2
            exit 1
          fi
          tar -xOf \
            ffmpeg-kit-source-${{ github.ref_name }}.tar.gz \
            ffmpeg-kit-source/SOURCE-LOCK.txt
      - name: release artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
        with:
          tag_name: ${{ github.ref_name }}
          name: aniyomi-ffmpeg-kit ${{ github.ref_name }}
          body: |
            Chimahon reproducible native build ${{ github.ref_name }}.

            The attached source archive contains the exact FFmpegKit wrapper,
            patched FFmpeg tree, and transitive native sources used by this
            build. Verify every artifact against `SHA256SUMS`.
          files: |
            aniyomi-ffmpeg-kit-${{ github.ref_name }}.aar
            ffmpeg-kit-source-${{ github.ref_name }}.tar.gz
            ffmpeg-kit-toolchain-${{ github.ref_name }}.tar.gz
            SHA256SUMS
          draft: false
          prerelease: false
      - name: print build logs
        if: ${{ always() }}
        run: cat build.log
